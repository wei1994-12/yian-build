name: Build and push images (public builder)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'IMAGE_TAG (empty = read version.json from source)'
        required: false
        default: ''
      source_ref:
        description: 'private source ref (default master)'
        required: false
        default: 'master'
  push:
    branches: [master]

permissions:
  contents: read

env:
  SOURCE_REPO: wei1994-12/yian-auto-reply
  GHCR_REGISTRY: ghcr.io
  ACR_REGISTRY: crpi-hmn01ibcb84nnrdr.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: mnsin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xianyu-backend-web
            dockerfile: backend-web/Dockerfile
            install_browsers: '1'
          - name: xianyu-websocket
            dockerfile: websocket/Dockerfile
            install_browsers: '1'
          - name: xianyu-scheduler
            dockerfile: scheduler/Dockerfile
            install_browsers: '0'
          - name: xianyu-frontend
            dockerfile: docker/frontend/Dockerfile
            install_browsers: ''
          - name: xianyu-update-runner
            dockerfile: updater/Dockerfile
            install_browsers: ''
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_PAT }}
          ref: ${{ github.event.inputs.source_ref || 'master' }}

      - name: Patch Dockerfiles for libatomic1 (Debian-13 trixie)
        run: |
          python3 - <<'PY'
          import pathlib

          ANCHOR = "    && rm -rf /var/lib/apt/lists/*"
          INSERT = "    && apt-get install -y --no-install-recommends libatomic1 \\\n"
          for t in ["backend-web/Dockerfile", "websocket/Dockerfile", "scheduler/Dockerfile"]:
              p = pathlib.Path(t)
              if not p.exists():
                  print("missing", t)
                  continue
              s = p.read_text(encoding="utf-8")
              if "libatomic1" in s:
                  print("skip", t, "(already has libatomic1)")
                  continue
              if ANCHOR not in s:
                  print("no anchor in", t)
                  continue
              p.write_text(s.replace(ANCHOR, INSERT + ANCHOR, 1), encoding="utf-8")
              print("patched", t)
          PY

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (via SOURCE_PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.SOURCE_PAT }}

      - name: Detect ACR credentials
        id: acr
        env:
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_USER" ] && [ -n "$ACR_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "[info] ACR push enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "[info] ACR secrets missing, push GHCR only"
          fi

      - name: Login ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.name }} (GHCR)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          GHCR_REF="$GHCR_REGISTRY/${{ github.repository_owner }}/${{ matrix.name }}:$TAG"
          echo "image: $GHCR_REF"
          BUILD_ARGS=()
          if [ -n "${{ matrix.install_browsers }}" ]; then
            BUILD_ARGS+=( --build-arg "INSTALL_BROWSERS=${{ matrix.install_browsers }}" )
          fi
          docker buildx build \
            --platform linux/amd64 \
            "${BUILD_ARGS[@]}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=false \
            --sbom=false \
            -f "${{ matrix.dockerfile }}" \
            -t "$GHCR_REF" \
            --push .

      - name: Push to ACR (retry x5)
        if: steps.acr.outputs.enabled == 'true'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          GHCR_REF="$GHCR_REGISTRY/${{ github.repository_owner }}/${{ matrix.name }}:$TAG"
          ACR_REF="$ACR_REGISTRY/$ACR_NAMESPACE/${{ matrix.name }}:$TAG"
          echo "[copy] $GHCR_REF -> $ACR_REF"
          BACKOFF=(60 120 180 240)
          for i in 1 2 3 4 5; do
            echo "[attempt $i/5] imagetools create $ACR_REF"
            if docker buildx imagetools create -t "$ACR_REF" "$GHCR_REF"; then
              echo "[ok] ACR push succeeded (attempt $i)"
              exit 0
            fi
            if [ "$i" = "5" ]; then
              break
            fi
            wait=${BACKOFF[$((i-1))]}
            echo "[warn] attempt $i failed, retrying in ${wait}s ..."
            sleep "$wait"
          done
          echo "::error::ACR push failed after 5 attempts: $ACR_REF"
          exit 1

      - name: Verify remote manifest
        timeout-minutes: 10
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          echo "[verify] GHCR"
          docker buildx imagetools inspect "$GHCR_REGISTRY/${{ github.repository_owner }}/${{ matrix.name }}:$TAG"
          if [ "${{ steps.acr.outputs.enabled }}" = "true" ]; then
            echo "[verify] ACR"
            docker buildx imagetools inspect "$ACR_REGISTRY/$ACR_NAMESPACE/${{ matrix.name }}:$TAG"
          fi
